<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f0e2"/>
      <stop offset="100%" stop-color="#ebe4d0"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#paper)"/>

  <!-- masthead row -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#34302a" letter-spacing="2.2">
    <text x="40" y="52">CAFFEINAGENT</text>
    <text x="560" y="52" text-anchor="end">INSTALL</text>
  </g>
  <line x1="40" y1="68" x2="560" y2="68" stroke="#14110d" stroke-opacity="0.12" stroke-width="1"/>

  <!-- editorial headline -->
  <text x="300" y="124"
        font-family="Georgia, 'Times New Roman', serif"
        font-style="italic"
        font-size="34"
        fill="#14110d"
        text-anchor="middle">
    drag to install.
  </text>

  <!-- arrow: starts high above the cup, swoops up + over, then drops down
       into the Applications icon. left end higher, right end lower → the
       whole curve tilts ~30° to the left so the gesture reads as "lift
       the coffee, drop it into Applications". -->
  <g stroke="#b8401a" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 200 200 Q 350 130, 490 250"/>
    <!-- arrowhead drawn as an explicit triangle so the rotation is visible.
         tip at (490,250). before rotation, the head pointed down-right; now
         it sits ~30° ccw of that, so it reads as pointing right with a hint
         of down. -->
    <path d="M 490 250 L 472 261 L 477 240 Z"
          fill="#b8401a"
          stroke="none"/>
  </g>
</svg>
