<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f0e2"/>
      <stop offset="100%" stop-color="#ebe4d0"/>
    </linearGradient>
    <!-- arrowhead as a marker so the tip aligns with the path tangent and
         joins the stroke seamlessly (no gap, no visible stub). -->
    <marker id="tip"
            viewBox="0 0 10 10"
            refX="9" refY="5"
            markerWidth="6" markerHeight="6"
            orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b8401a"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="url(#paper)"/>

  <!-- masthead: brand only. dropped the redundant "INSTALL" tag — the
       headline below already says what to do. -->
  <text x="40" y="52"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="11"
        fill="#34302a"
        letter-spacing="2.2">AGENT CAFFEINE</text>
  <line x1="40" y1="68" x2="560" y2="68"
        stroke="#14110d" stroke-opacity="0.12" stroke-width="1"/>

  <!-- editorial headline: the one moment that earns serif italic. -->
  <text x="300" y="148"
        font-family="Georgia, 'Times New Roman', serif"
        font-style="italic"
        font-size="36"
        fill="#14110d"
        text-anchor="middle">drag to install.</text>

  <!-- the one gesture: lift from .app, swoop high, land on Applications.
       single quadratic curve, marker-end handles the arrowhead cleanly. -->
  <path d="M 220 215 Q 360 105, 460 248"
        stroke="#b8401a"
        stroke-width="3.5"
        fill="none"
        stroke-linecap="round"
        marker-end="url(#tip)"/>
</svg>
