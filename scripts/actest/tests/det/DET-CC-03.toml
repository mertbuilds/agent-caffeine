id = "DET-CC-03"
title = "Claude Code: permission wait, then a quiet approved tool"
layer = 1
area = "det"
minutes = 10
risk = "Low: one short paid turn."
why = "The wait must show. After the approval the session file may keep its old time, and a quiet tool could be released after 5 minutes. Every other Claude Code session must be idle for this test, so it cannot run while the assistant works in Claude Code on this Mac."
checks = [
  "within 20s after step 2: app.agent[claude].state=waiting",
  "always from step 2 + 20s to step 4 - 5s: app.agent[claude].state=waiting",
  "within 10s after step 4: app.agent[claude].state=working",
  "always from step 4 + 10s to step 4 + 395s: app.agent[claude].state=working",
  "always from step 4 + 10s to step 4 + 395s: app.agent[claude].hold=working",
  "within 15s after step 5 - 5s: app.agent[claude].state=idle",
  "info within 25s after step 2: app.notice[waiting].age<30",
  "info at step 3: app.agent[claude].why=asksPermission",
]

[needs]
agents = ["claude"]

[[steps]]
say = "The runner checks that Claude Code is open and idle. If it waits here, end the turn that runs in Claude Code."
until = "app.agent[claude].state=idle"
timeout = 60

[[steps]]
say = "In one Claude Code session started without the skip-permissions flag, send this prompt: run `sleep 400` in the shell, then say done. Press Enter here at the moment the approval question shows."
key = "enter"

[[steps]]
say = "Do not answer the question. The runner waits 60 seconds."
until = "time>=60s"
timeout = 120

[[steps]]
say = "Approve the command now. Press Enter here at the moment you approve."
key = "enter"

[[steps]]
say = "Wait for the full answer. Press Enter here at the moment the answer is complete."
key = "enter"
