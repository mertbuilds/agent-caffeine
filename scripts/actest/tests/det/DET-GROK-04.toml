id = "DET-GROK-04"
title = "Grok Build: a stopped turn lets go, the next prompt holds"
layer = 1
area = "det"
minutes = 3
risk = "Low: two short paid turns."
why = "If Grok writes no end event for a cancelled turn, the turn reads working until Grok quits."
checks = [
  "within 10s after step 2: app.agent[grok].state=working",
  "within 10s after step 3: app.agent[grok].state=idle",
  "never from step 3 to step 4: app.agent[grok].state=waiting",
  "always from step 3 + 10s to step 4: app.agent[grok].state=idle",
  "within 10s after step 5: app.agent[grok].state=working",
]

[needs]
agents = ["grok"]

[[steps]]
say = "The runner checks that Grok Build is open and idle. If it waits here, end the turn that runs in Grok Build."
until = "app.agent[grok].state=idle"
timeout = 60

[[steps]]
say = "In Grok Build, send this prompt: run `sleep 120` in the shell. Press Enter here at the moment you send it."
key = "enter"

[[steps]]
say = "Wait about 20 seconds. Then stop the turn with Esc. Press Enter here at the moment you stop it."
key = "enter"

[[steps]]
say = "Nothing to do. The runner watches for 30 seconds."
until = "time>=30s"
timeout = 60

[[steps]]
say = "In Grok Build, send this prompt: say hi. Press Enter here at the moment you send it."
key = "enter"

[[steps]]
say = "Press Enter here when the answer is complete."
key = "enter"
