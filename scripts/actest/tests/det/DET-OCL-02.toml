id = "DET-OCL-02"
title = "OpenClaw works through a real turn of the gateway"
layer = 1
area = "det"
minutes = 10
risk = "Low: one short paid turn."
why = "A real turn through the gateway was never seen. The result decides the level of OpenClaw and the Not tested yet mark."
checks = [
  "within 15s after step 2: app.agent[openclaw].state=working",
  "always from step 2 + 15s to step 3 - 5s: app.agent[openclaw].state=working",
  "always from step 2 + 15s to step 3 - 5s: app.agent[openclaw].hold=working",
  "within 15s after step 3 - 5s: app.agent[openclaw].state=idle",
  "within 315s after step 3 - 5s: app.agent[openclaw].hold=none",
  "info at step 2 + 20s: app.agent[openclaw].why=reportsBusy",
  "info within 10s after step 3 - 5s: app.agent[openclaw].hold=finished",
  "info within 15s after step 3 - 5s: app.notice[finished].age<20",
]

[needs]
agents = ["openclaw"]

[[steps]]
say = "The runner checks that OpenClaw is open and idle. If it waits here, end the turn that runs in OpenClaw."
until = "app.agent[openclaw].state=idle"
timeout = 60

[[steps]]
say = "In OpenClaw (one message through the gateway), send this prompt: run `sleep 90` in the shell, then say done. Press Enter here at the moment you send it."
key = "enter"

[[steps]]
say = "Wait for the full answer. Press Enter here at the moment the answer is complete."
key = "enter"

[[steps]]
say = "Nothing to do. The runner waits until Agent Caffeine lets go of OpenClaw."
until = "app.agent[openclaw].hold=none"
timeout = 360
