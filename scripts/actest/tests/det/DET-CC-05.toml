id = "DET-CC-05"
title = "Claude Code: Esc in a turn"
layer = 1
area = "det"
minutes = 3
risk = "Low: two short paid turns."
why = "A stopped turn must release, and the next prompt must hold. Every other Claude Code session must be idle for this test, so it cannot run while the assistant works in Claude Code on this Mac."
checks = [
  "within 10s after step 2: app.agent[claude].state=working",
  "within 10s after step 3: app.agent[claude].state=idle",
  "never from step 3 to step 4: app.agent[claude].state=waiting",
  "always from step 3 + 10s to step 4: app.agent[claude].state=idle",
  "within 10s after step 5: app.agent[claude].state=working",
]

[needs]
agents = ["claude"]

[[steps]]
say = "The runner checks that Claude Code is open and idle. If it waits here, end the turn that runs in Claude Code."
until = "app.agent[claude].state=idle"
timeout = 60

[[steps]]
say = "In one Claude Code session in a terminal, send this prompt: run `sleep 120` in the shell. Press Enter here at the moment you send it."
key = "enter"

[[steps]]
say = "Wait about 20 seconds. Then stop the turn with Esc. Press Enter here at the moment you stop it."
key = "enter"

[[steps]]
say = "Nothing to do. The runner watches for 30 seconds."
until = "time>=30s"
timeout = 60

[[steps]]
say = "In one Claude Code session in a terminal, send this prompt: say hi. Press Enter here at the moment you send it."
key = "enter"

[[steps]]
say = "Press Enter here when the answer is complete."
key = "enter"
