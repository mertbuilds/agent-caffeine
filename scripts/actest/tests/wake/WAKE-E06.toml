id = "WAKE-E06"
title = "From the wake to the first line of the job"
layer = 1
area = "wake"
minutes = 11
risk = "You load one launchd job and remove it after. The Mac wakes once with the lid closed."
why = "Sets the lead time, which is 60 seconds now: the disk must be ready when the job starts. Needs an idle Mac: the app must be on for its alarm and its job hold, and an agent that works would keep the Mac awake with the lid closed. A Mac that never sleeps cannot be woken by an alarm."
heartbeat = true
watch = ["sched"]
checks = [
  "log from step 3 to step 4 has Sleep",
  "within 10s after step 4: app.history[alarmSet]>=1",
  "within 100s after step 4: probe.job_lines>=1",
  "within 75s after step 4: probe.job_lines>=1",
  "info within 65s after step 4: probe.job_lines>=1",
]

[needs]
power = "ac"
helper = true
display = "builtin"
wake_for_jobs = true
idle = true

[probes.job_plist]
kind = "exists"
path = "~/Library/LaunchAgents/com.caffeinagent.actest.job.plist"

[probes.job_lines]
kind = "lines"
path = "{run}/job.log"

[[steps]]
say = "The runner wrote a test job that runs at {job_hhmm}. It appends lines to a file in the folder of this run and does nothing else. Load it."
write = "launchd-job"
in_minutes = 5
job_seconds = 20
command = "cp \"{job_plist}\" ~/Library/LaunchAgents/ && launchctl bootstrap gui/$UID ~/Library/LaunchAgents/com.caffeinagent.actest.job.plist"
until = "probe.job_plist=true"
timeout = 240

[[steps]]
say = "Open Settings of Agent Caffeine, the part Wake for jobs. Switch on the job com.caffeinagent.actest.job."
until = "app.jobs.enabled>=1"
timeout = 240

[[steps]]
say = "Close the lid now. Open it at {job_hhmm+3}, not before."
until = "lid=closed"
timeout = 200

[[steps]]
say = "The lid is closed. The runner waits for the Mac to wake for the job."
until = "app.jobholds>=1"
timeout = 900

[[steps]]
say = "The runner waits for the job hold to end."
until = "app.jobholds=0"
timeout = 920

[[steps]]
say = "Open the lid at the time you were told."
until = "lid=open"
timeout = 1200

[[cleanup]]
expect = "probe.job_plist=false"
tell = "Remove the test job. Run: launchctl bootout gui/$UID/com.caffeinagent.actest.job; rm ~/Library/LaunchAgents/com.caffeinagent.actest.job.plist"
