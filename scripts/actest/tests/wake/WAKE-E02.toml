id = "WAKE-E02"
title = "Kind and length of an alarm wake with no hold, lid closed on power"
layer = 1
area = "wake"
minutes = 8
risk = "You set one wake alarm with sudo. It fires once and is gone. Agent Caffeine is off for the test: an agent that works stops while the Mac sleeps, about 6 minutes."
why = "Decides if the app has time to take the hold. Of the four cases this file does lid closed on power. E01 does battery. The two lid open cases come later. It tests macOS and a plain alarm, not our hold, so it needs no idle Mac: it needs a Mac that sleeps, and Agent Caffeine off gives that while agents work."
watch = ["sched"]
checks = [
  "log from step 3 to alarm - 10s has Sleep",
  "log within 20s after alarm - 5s has AlarmWake",
  "at end: sched.byhand=false",
  "info log from alarm - 5s to step 4 has DarkWake",
  "info log from alarm - 5s to step 4 has Wake",
  "info log within 120s after alarm has Sleep",
]

[needs]
power = "ac"
charge = 40
display = "builtin"
sleeps = true

[[steps]]
say = "Switch Agent Caffeine off (the switch in its menu)."
until = "app.on=false and sleepdisabled=0"
timeout = 180

[[steps]]
say = "Set a wake alarm for {alarm_hhmm}. The runner never sets one itself."
alarm_in = 4
command = "sudo pmset schedule wake \"{alarm_date}\""
until = "sched.byhand=true"
timeout = 150

[[steps]]
say = "Close the lid now. Open it at {alarm_hhmm+2}, not before."
until = "lid=closed"
timeout = 60

[[steps]]
say = "Open the lid at the time you were told."
until = "lid=open"
timeout = 900

[[steps]]
say = "Switch Agent Caffeine on again."
until = "app.on=true"
timeout = 180

[[cleanup]]
expect = "sched.byhand=false"
tell = "Your alarm is still set. Run: pmset -g sched. Then: sudo pmset schedule cancel wake \"<its date>\""
