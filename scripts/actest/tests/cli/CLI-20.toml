id = "CLI-20"
title = "Set up for agents: Remove takes our files and the link away"
layer = 1
area = "cli"
minutes = 2
risk = "Files in the folders of the agents go. CLI-16 puts them back."
why = "Only our files go. Run it before CLI-16, so CLI-16 tests a real install."
checks = [
  "at step 1: probe.skill_claude=false and probe.skill_agents=false and probe.link=false",
  "key edited is no",
]

[probes.skill_claude]
kind = "contains"
path = "~/.claude/skills/agent-caffeine/SKILL.md"
contains = "agent-caffeine-skill"

[probes.skill_agents]
kind = "contains"
path = "~/.agents/skills/agent-caffeine/SKILL.md"
contains = "agent-caffeine-skill"

[probes.link]
kind = "link"
path = "~/.local/bin/agent-caffeine"
contains = "/Contents/MacOS/agent-caffeine"

[[steps]]
say = "Open Settings of Agent Caffeine, the tab Agents. In the block Set up for agents, open Details and click Remove."
until = "probe.skill_claude=false and probe.link=false"
timeout = 300

[[steps]]
say = "One question."
ask = "Does Settings say that a skill you edited was kept?"
name = "edited"
