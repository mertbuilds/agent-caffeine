id = "CLI-01"
title = "hold --for keeps the Mac awake and ends at its time"
layer = 1
area = "cli"
minutes = 2
risk = "None."
why = "A script can ask for the Mac to stay awake. Never run against the real app. While an agent works the life of the hold is judged, by its id: it is in the list of the app and it ends at its time. That the Mac is awake because of this hold, and can sleep after it, shows on an idle Mac only."
checks = [
  "exit hold == 0",
  "within 3s after step 1 start: held.hold=true and app.hold=true",
  "if idle: within 3s after step 1 start: app.headline=manualHold",
  "key row is yes",
  "within 65s after step 1: held.hold=false",
  "if idle: within 5s after step 3: app.hold=false",
]

[[steps]]
say = "Nothing to do. The runner starts a hold of 60 seconds."
run = ["agent-caffeine", "hold", "--for", "60s", "--json"]
name = "hold"
until = "held.hold=true"
timeout = 10

[[steps]]
say = "Open the menu of Agent Caffeine."
ask = "Is there a row for the hold, with a Stop link?"
name = "row"

[[steps]]
say = "Nothing to do. The hold ends by itself."
until = "held.hold=false"
timeout = 90

[[steps]]
say = "Nothing to do."
until = "time>=6s"
timeout = 30
