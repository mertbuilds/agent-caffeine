id = "CLI-07"
title = "status and status --json tell the truth of the app"
layer = 1
area = "cli"
minutes = 3
risk = "Agent Caffeine is paused for some seconds. Keep the lid open: while it is paused nothing keeps an agent that works awake."
why = "status must say what the app decided: with a hold, and while paused. A pause beats a hold and a working agent alike, so every rule is true while agents work too: status says awake false under the pause though the hold is still there, and awake true after it."
checks = [
  "exit plain == 0",
  "out plain contains stays awake",
  "out json contains \"awake\":true",
  "out paused contains \"awake\":false",
  "at step 4: app.hold=false and held.hold=true",
  "at step 6: app.hold=true and held.hold=true",
  "info at step 4: app.agent[*].state=working",
]

[[steps]]
say = "Nothing to do. The runner starts a hold of 10 minutes."
run = ["agent-caffeine", "hold", "--for", "10m", "--json"]
name = "hold"
until = "held.hold=true and app.hold=true"
timeout = 10

[[steps]]
say = "Nothing to do. The runner reads the status."
run = ["agent-caffeine", "status"]
name = "plain"

[[steps]]
say = "Nothing to do. The runner reads the status as JSON."
run = ["agent-caffeine", "status", "--json"]
name = "json"

[[steps]]
say = "Pause Agent Caffeine for 30 minutes (the timer button in its menu)."
until = "app.paused=true"
timeout = 180

[[steps]]
say = "Nothing to do. The runner reads the status again."
run = ["agent-caffeine", "status", "--json"]
name = "paused"

[[steps]]
say = "Click Resume in the menu of Agent Caffeine."
until = "app.paused=false and app.hold=true"
timeout = 180
