name: Caffeinagent
options:
  bundleIdPrefix: com.caffeinagent
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  # Auto-update. The binary target ships Sparkle.framework, which Xcode embeds
  # in Contents/Frameworks and signs with the app's identity. Pinned, because
  # Package.resolved is not committed and every release build resolves anew.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.2.3"
    CURRENT_PROJECT_VERSION: "13"
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: NO
  configs:
    Debug:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "-"
      DEVELOPMENT_TEAM: ""
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Developer ID Application"
      DEVELOPMENT_TEAM: "3HGP3W3TLD"
      PROVISIONING_PROFILE_SPECIFIER: ""
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      OTHER_CODE_SIGN_FLAGS: "--timestamp --options runtime"

targets:
  Caffeinagent:
    type: application
    platform: macOS
    sources:
      - Caffeinagent
      # The license texts of what the app bundles, and the notices that name
      # each component. Both land in Contents/Resources.
      - path: Resources/Licenses
        type: folder
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      # The launchd plist of the root helper. SMAppService.daemon(plistName:)
      # looks for it in Contents/Library/LaunchDaemons.
      - path: CaffeinagentHelper/com.caffeinagent.app.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    info:
      path: Caffeinagent/Info.plist
      properties:
        CFBundleName: agent caffeine
        CFBundleDisplayName: agent caffeine
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: APPL
        # The icon is Caffeinagent/AppIcon.icon, an Icon Composer file. Xcode
        # compiles it into Assets.car, which macOS 26 reads through
        # CFBundleIconName, and writes AppIcon.icns next to it for macOS 13
        # to 15, which read CFBundleIconFile.
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSHumanReadableCopyright: "Copyright © 2026"
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        # Sparkle. The appcast is written by scripts/release.sh and served by
        # the site. SUPublicEDKey is the public half of the EdDSA key pair in
        # the login keychain under the account agent-caffeine, backed up in
        # ~/.config/agent-caffeine/sparkle-ed25519.key.
        SUFeedURL: https://caffeinagent.com/mac/appcast.xml
        SUPublicEDKey: 5Q7Ek65kUpr2mdD+E8nQibAj7cYGf2/gK9ImD3PqVLY=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caffeinagent.app
        PRODUCT_NAME: caffeinagent
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        CODE_SIGN_ENTITLEMENTS: Caffeinagent/Caffeinagent.entitlements
    postBuildScripts:
      # Sparkle's Swift package ships an ad-hoc signed xcframework, and Xcode's
      # embed step re-signs only the outer framework, so Updater.app, the two
      # XPC services and Autoupdate would still be ad-hoc and the notary
      # service would refuse the app. The app is not sandboxed, so it never
      # uses the XPC services, but they are in the bundle and are signed too.
      # They are signed inside out, none of them carries an entitlement to
      # keep, and Xcode seals the app after this phase.
      - name: Sign Sparkle's nested helpers
        basedOnDependencyAnalysis: false
        script: |
          [ "${CODE_SIGNING_ALLOWED:-NO}" = "YES" ] || exit 0
          FRAMEWORK="$CODESIGNING_FOLDER_PATH/Contents/Frameworks/Sparkle.framework/Versions/B"
          [ -d "$FRAMEWORK" ] || exit 0
          for item in \
            "$FRAMEWORK/XPCServices/Downloader.xpc" \
            "$FRAMEWORK/XPCServices/Installer.xpc" \
            "$FRAMEWORK/Updater.app" \
            "$FRAMEWORK/Autoupdate" \
            "$FRAMEWORK"
          do
            codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" $OTHER_CODE_SIGN_FLAGS "$item" || exit 1
          done
    dependencies:
      - package: Sparkle
      # Lands in Contents/MacOS, where the BundleProgram key of the launchd
      # plist points, and is signed on copy with the app's identity.
      - target: CaffeinagentHelper
        embed: true
        codeSign: true
        copy:
          destination: executables
      # The command the agents' hooks run. The hook entries point at it in
      # Contents/MacOS of the copy in /Applications.
      - target: CaffeinagentHook
        embed: true
        codeSign: true
        copy:
          destination: executables
    scheme:
      testTargets:
        - CaffeinagentTests

  # Root daemon that sets and clears SleepDisabled. The app registers it
  # through SMAppService and talks to it over XPC. The Info.plist goes into
  # the binary, so the signature carries the bundle id the app requires. The
  # empty entitlements file stops Xcode from adding an application identifier
  # entitlement, which macOS refuses on a binary without a provisioning profile.
  CaffeinagentHelper:
    type: tool
    platform: macOS
    sources:
      - path: CaffeinagentHelper
        excludes:
          - "*.plist"
      - Caffeinagent/Power/SleepFlagHelperProtocol.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caffeinagent.app.helper
        PRODUCT_NAME: CaffeinagentHelper
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        CODE_SIGN_ENTITLEMENTS: CaffeinagentHelper/CaffeinagentHelper.entitlements
        SKIP_INSTALL: YES

  # The hook command: it starts in a few milliseconds, where the app binary
  # with SwiftUI and Sparkle would not, so it is a tool of its own. It
  # shares the event table, the state file and the process matching with
  # the app.
  CaffeinagentHook:
    type: tool
    platform: macOS
    sources:
      - CaffeinagentHook
      - Caffeinagent/Detection/Hooks/HookEvents.swift
      - Caffeinagent/Detection/Hooks/HookStateFile.swift
      - Caffeinagent/Detection/Hooks/HookCommand.swift
      - Caffeinagent/Detection/ReportedState.swift
      - Caffeinagent/Detection/AgentCatalog.swift
      - Caffeinagent/Detection/ProcessCensus.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caffeinagent.app.hook
        PRODUCT_NAME: CaffeinagentHook
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        CODE_SIGN_ENTITLEMENTS: CaffeinagentHelper/CaffeinagentHelper.entitlements
        SKIP_INSTALL: YES

  # Compiles the pure logic files directly instead of loading the app as a
  # test host, so tests never start the app's power and sleep flag handling.
  CaffeinagentTests:
    type: bundle.unit-test
    platform: macOS
    # XCTest itself requires macOS 14.
    deploymentTarget: "14.0"
    sources:
      - CaffeinagentTests
      - Caffeinagent/Models/AwakeMode.swift
      - Caffeinagent/Models/AppVersion.swift
      - Caffeinagent/License/Entitlement.swift
      - Caffeinagent/License/LicenseClient.swift
      - Caffeinagent/License/LicenseConfig.swift
      - Caffeinagent/License/LicenseManager.swift
      - Caffeinagent/License/LicenseStore.swift
      # Optional, so the project still generates on a branch without the folder.
      - path: Caffeinagent/Detection
        optional: true
      # Without the two files that reach into the system: SMAppService and
      # XPC, and the battery reader that needs PowerSource.
      - path: Caffeinagent/Power
        excludes:
          - SleepFlagSystem.swift
          - SafetyInputsReader.swift
      # The menu's model, the agent marks and the path reader. No SwiftUI.
      - Caffeinagent/UI/Panel/Model
      - Caffeinagent/UI/OnboardingModel.swift
      - Caffeinagent/UI/HookPreferences.swift
      - CaffeinagentHelper/HelperCore.swift
      - CaffeinagentHelper/HelperService.swift
      - CaffeinagentHelper/SleepFlagWatchdog.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caffeinagent.tests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
