name: Caffeinagent
options:
  bundleIdPrefix: com.caffeinagent
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  # Auto-update. The binary target ships Sparkle.framework, which Xcode embeds
  # in Contents/Frameworks and signs with the app's identity. Pinned, because
  # Package.resolved is not committed and every release build resolves anew.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "24"
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: NO
  configs:
    Debug:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "-"
      DEVELOPMENT_TEAM: ""
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Developer ID Application"
      DEVELOPMENT_TEAM: "3HGP3W3TLD"
      PROVISIONING_PROFILE_SPECIFIER: ""
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      OTHER_CODE_SIGN_FLAGS: "--timestamp --options runtime"

targets:
  Caffeinagent:
    type: application
    platform: macOS
    sources:
      - Caffeinagent
      # The license of the app, the license texts of what it bundles, and the
      # notices that name each component. Both land in Contents/Resources.
      - path: Resources/Licenses
        type: folder
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      # The skill that tells an agent how to use the command line tool, as
      # Contents/Resources/skills/agent-caffeine/SKILL.md. "Set up for
      # agents" writes it into the skills folders of the agents, and
      # `agent-caffeine skill` prints it.
      - path: skills
        type: folder
      # The launchd plist of the root helper. SMAppService.daemon(plistName:)
      # looks for it in Contents/Library/LaunchDaemons.
      - path: CaffeinagentHelper/com.caffeinagent.app.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    info:
      path: Caffeinagent/Info.plist
      properties:
        CFBundleName: Agent Caffeine
        CFBundleDisplayName: Agent Caffeine
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: APPL
        # The icon is Caffeinagent/AppIcon.icon, an Icon Composer file. Xcode
        # compiles it into Assets.car, which macOS 26 reads through
        # CFBundleIconName, and writes AppIcon.icns next to it for macOS 13
        # to 15, which read CFBundleIconFile.
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSHumanReadableCopyright: "Copyright © 2026 Mert Duzgun"
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        # "Join your iPhone hotspot": from macOS 14 on, macOS shows the
        # names of Wi-Fi networks only to an app that is allowed in
        # Location Services. Asked when the user saves a hotspot, never at
        # launch.
        NSLocationUsageDescription: "Agent Caffeine needs this to find your iPhone hotspot by its name. It does not read or keep your location."
        NSLocationWhenInUseUsageDescription: "Agent Caffeine needs this to find your iPhone hotspot by its name. It does not read or keep your location."
        # Sparkle. The appcast is written by scripts/release.sh and served by
        # the site. SUPublicEDKey is the public half of the EdDSA key pair in
        # the login keychain under the account agent-caffeine, backed up in
        # ~/.config/agent-caffeine/sparkle-ed25519.key.
        SUFeedURL: https://caffeinagent.com/mac/appcast.xml
        SUPublicEDKey: 5Q7Ek65kUpr2mdD+E8nQibAj7cYGf2/gK9ImD3PqVLY=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caffeinagent.app
        PRODUCT_NAME: caffeinagent
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The brand blue of `Color.brand`, for the controls AppKit draws itself.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        CODE_SIGN_ENTITLEMENTS: Caffeinagent/Caffeinagent.entitlements
    postBuildScripts:
      # Sparkle's Swift package ships an ad-hoc signed xcframework, and Xcode's
      # embed step re-signs only the outer framework, so Updater.app, the two
      # XPC services and Autoupdate would still be ad-hoc and the notary
      # service would refuse the app. The app is not sandboxed, so it never
      # uses the XPC services, but they are in the bundle and are signed too.
      # They are signed inside out, none of them carries an entitlement to
      # keep, and Xcode seals the app after this phase.
      - name: Sign Sparkle's nested helpers
        basedOnDependencyAnalysis: false
        script: |
          [ "${CODE_SIGNING_ALLOWED:-NO}" = "YES" ] || exit 0
          FRAMEWORK="$CODESIGNING_FOLDER_PATH/Contents/Frameworks/Sparkle.framework/Versions/B"
          [ -d "$FRAMEWORK" ] || exit 0
          for item in \
            "$FRAMEWORK/XPCServices/Downloader.xpc" \
            "$FRAMEWORK/XPCServices/Installer.xpc" \
            "$FRAMEWORK/Updater.app" \
            "$FRAMEWORK/Autoupdate" \
            "$FRAMEWORK"
          do
            codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" $OTHER_CODE_SIGN_FLAGS "$item" || exit 1
          done
    dependencies:
      - package: Sparkle
      # Lands in Contents/MacOS, where the BundleProgram key of the launchd
      # plist points, and is signed on copy with the app's identity.
      - target: CaffeinagentHelper
        embed: true
        codeSign: true
        copy:
          destination: executables
      # The command the agents' hooks run. The hook entries point at it in
      # Contents/MacOS of the copy in /Applications.
      - target: CaffeinagentHook
        embed: true
        codeSign: true
        copy:
          destination: executables
      # The command line tool, agent-caffeine. Settings shows its path in
      # Contents/MacOS, and "Set up for agents" links it into ~/.local/bin.
      - target: CaffeinagentCLI
        embed: true
        codeSign: true
        copy:
          destination: executables
    scheme:
      testTargets:
        - CaffeinagentTests

  # Root daemon that sets and clears SleepDisabled and keeps one wake alarm:
  # two booleans and one wake time, nothing else. The app registers it
  # through SMAppService and talks to it over XPC. The Info.plist goes into
  # the binary, so the signature carries the bundle id the app requires. The
  # empty entitlements file stops Xcode from adding an application identifier
  # entitlement, which macOS refuses on a binary without a provisioning profile.
  CaffeinagentHelper:
    type: tool
    platform: macOS
    sources:
      - path: CaffeinagentHelper
        excludes:
          - "*.plist"
      - Caffeinagent/Power/SleepFlagHelperProtocol.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caffeinagent.app.helper
        PRODUCT_NAME: CaffeinagentHelper
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        CODE_SIGN_ENTITLEMENTS: CaffeinagentHelper/CaffeinagentHelper.entitlements
        SKIP_INSTALL: YES

  # The hook command: it starts in a few milliseconds, where the app binary
  # with SwiftUI and Sparkle would not, so it is a tool of its own. It
  # shares the event table, the state file and the process matching with
  # the app.
  CaffeinagentHook:
    type: tool
    platform: macOS
    sources:
      - CaffeinagentHook
      - Caffeinagent/Detection/Hooks/HookEvents.swift
      - Caffeinagent/Detection/Hooks/HookStateFile.swift
      - Caffeinagent/Detection/Hooks/HookCommand.swift
      - Caffeinagent/Detection/ReportedState.swift
      - Caffeinagent/Detection/AgentCatalog.swift
      - Caffeinagent/Detection/ProcessCensus.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caffeinagent.app.hook
        PRODUCT_NAME: CaffeinagentHook
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        CODE_SIGN_ENTITLEMENTS: CaffeinagentHelper/CaffeinagentHelper.entitlements
        SKIP_INSTALL: YES

  # The command line tool: `agent-caffeine hold`, `release`, `status`,
  # `mcp` and `skill`. Like the hook command it is a tool of its own that writes small
  # files for the app to read, and it shares the format of those files and
  # the process table with the app.
  CaffeinagentCLI:
    type: tool
    platform: macOS
    sources:
      - CaffeinagentCLI
      - Caffeinagent/Detection/Holds/ManualHold.swift
      - Caffeinagent/Detection/Holds/HoldStore.swift
      - Caffeinagent/Detection/HumaneDuration.swift
      - Caffeinagent/Detection/ProcessCensus.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caffeinagent.app.cli
        PRODUCT_NAME: agent-caffeine
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        CODE_SIGN_ENTITLEMENTS: CaffeinagentHelper/CaffeinagentHelper.entitlements
        SKIP_INSTALL: YES

  # Compiles the pure logic files directly instead of loading the app as a
  # test host, so tests never start the app's power and sleep flag handling.
  CaffeinagentTests:
    type: bundle.unit-test
    platform: macOS
    # XCTest itself requires macOS 14.
    deploymentTarget: "14.0"
    sources:
      - CaffeinagentTests
      - Caffeinagent/Models/AwakeMode.swift
      - Caffeinagent/Models/AppVersion.swift
      - Caffeinagent/Models/PublishedOnChange.swift
      # The state of "open at login", without SMAppService.
      - Caffeinagent/LoginItem.swift
      # Where the app runs from. The alerts are never shown by a test.
      - Caffeinagent/AppRelocator.swift
      # What the paid versions left. Without the call to the Keychain.
      - Caffeinagent/PaidLeftovers.swift
      # Optional, so the project still generates on a branch without the folder.
      - path: Caffeinagent/Detection
        optional: true
      # Without the two files that reach into the system: SMAppService and
      # XPC, and the battery reader that needs PowerSource.
      - path: Caffeinagent/Power
        excludes:
          - SleepFlagSystem.swift
          - SafetyInputsReader.swift
          - DisplaySystem.swift
      # The menu's model, the agent marks and the path reader. No SwiftUI.
      - Caffeinagent/UI/Panel/Model
      # The states the previews show, so the tests cover every one of them.
      - Caffeinagent/UI/Panel/PanelFixtures.swift
      - Caffeinagent/UI/MenuBarIcon.swift
      - Caffeinagent/UI/OnboardingModel.swift
      - Caffeinagent/UI/HookPreferences.swift
      - Caffeinagent/UI/SkillPreferences.swift
      - Caffeinagent/UI/JobPreferences.swift
      # The shortcut as a value and its rules, and the reader of a keyboard
      # layout. Without the hot key itself.
      - Caffeinagent/Shortcut/Shortcut.swift
      - Caffeinagent/Shortcut/SystemKeyLayout.swift
      # With a centre that stands in for UNUserNotificationCenter.
      - Caffeinagent/Notifier.swift
      - CaffeinagentHelper/HelperCore.swift
      - CaffeinagentHelper/HelperService.swift
      - CaffeinagentHelper/SleepFlagWatchdog.swift
      - CaffeinagentHelper/WakeAlarmCore.swift
      # The commands and the MCP server of the command line tool, without
      # the part that starts a process.
      - CaffeinagentCLI/HoldCommand.swift
      - CaffeinagentCLI/MCPServer.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caffeinagent.tests
        GENERATE_INFOPLIST_FILE: YES
        # Watches for settings files a test leaves in ~/Library/Preferences.
        INFOPLIST_KEY_NSPrincipalClass: TestDefaultsGuard
        ENABLE_HARDENED_RUNTIME: NO
