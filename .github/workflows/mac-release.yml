name: Mac release
run-name: "${{ github.event_name == 'push' && format('Release request at {0}', github.sha) || format('{0} {1}', github.ref_name, inputs.dry_run && '(dry run)' || '(REAL RELEASE)') }}"

# Builds, signs, notarizes and uploads the Mac app with scripts/release.sh, the
# same script the owner runs on the Mac. The uploads are live at once. Every
# secret is a secret of the environment mac-release, whose required reviewer
# approves each run. Setup and the list of secrets: CONTRIBUTING.md, "Release".
#
# A release is asked for by a push to main that raises CURRENT_PROJECT_VERSION
# in project.yml above the highest build in the published appcast. No tag
# starts a run: the job `github-release` writes v<version> after a release, as
# a record. There is no pull_request trigger, and there must never be one.

on:
  push:
    branches: [main]
    paths:
      - project.yml
  workflow_dispatch:
    inputs:
      dry_run:
        description: Do everything but the uploads, and keep the files as an artifact
        type: boolean
        default: true

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  # No environment and no secret. It decides whether the push asks for a
  # release, so that a change to project.yml with no newer build number never
  # asks the owner for an approval: that request is made when `release` starts.
  detect:
    name: Detect a release request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.request.outputs.version }}
      build: ${{ steps.request.outputs.build }}
      should_release: ${{ steps.request.outputs.should_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the build number with the published one
        id: request
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::a manual run must be on main, not on $GITHUB_REF"
            exit 1
          fi
          bash scripts/release-request.sh

      # The run's page shows this before anyone approves.
      - name: Say what the run will do
        env:
          VERSION: ${{ steps.request.outputs.version }}
          BUILD: ${{ steps.request.outputs.build }}
          SHOULD_RELEASE: ${{ steps.request.outputs.should_release }}
          DECISION: ${{ steps.request.outputs.decision }}
        run: |
          set -euo pipefail
          what="Agent Caffeine for Mac $VERSION (build $BUILD), commit $GITHUB_SHA"
          {
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN" = "true" ]; then
              echo "### Dry run: $what"
              echo "Nothing is uploaded. The run waits for the approval of the environment mac-release."
            elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "### REAL RELEASE, started by hand: $what"
              echo "The run waits for the approval of the environment mac-release. The uploads are live at once."
            elif [ "$SHOULD_RELEASE" = "true" ]; then
              echo "### REAL RELEASE: $what"
              echo "The run waits for the approval of the environment mac-release. The uploads are live at once."
            else
              echo "### No release"
              echo "No approval is asked for."
            fi
            echo ""
            echo "$DECISION"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Release ${{ needs.detect.outputs.version }} (${{ needs.detect.outputs.build }}) ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '(dry run)' || '(REAL RELEASE)' }}
    needs: detect
    if: needs.detect.outputs.should_release == 'true' || github.event_name == 'workflow_dispatch'
    # Apple Silicon. Keep the image and the Xcode the same as in mac-ci.yml.
    runs-on: macos-26
    environment: mac-release
    # One release at a time, and a run that has started is never cancelled. A
    # dry run uploads nothing, so it has a group of its own and does not wait
    # behind a release that is waiting for its approval.
    concurrency:
      group: mac-release${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '-dry-run' || '' }}
      cancel-in-progress: false
    timeout-minutes: 120
    outputs:
      version: ${{ steps.result.outputs.version }}
      build: ${{ steps.result.outputs.build }}
      filename: ${{ steps.result.outputs.filename }}
      url: ${{ steps.result.outputs.url }}
      sha256: ${{ steps.result.outputs.sha256 }}
      uploaded: ${{ steps.result.outputs.uploaded }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, for the check against origin/main below.
          fetch-depth: 0
          persist-credentials: false

      - name: Check the ref
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::a release runs on main, not on $GITHUB_REF"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::this commit is not on main"
            exit 1
          fi

      # The job can wait a long time for its approval, and another release can
      # go out in between. Asked again here, before the long build and before
      # any key is on the runner. release.sh holds the same rule once more.
      - name: Check the build number again
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            bash scripts/release-request.sh
          elif ! bash scripts/release-request.sh --require-newer; then
            echo "::error::the build number in project.yml is not above the published one, or it could not be compared, so nothing is released"
            exit 1
          fi

      - name: Select Xcode 26.6
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app

      # The release binary of the version the project is generated with on the
      # owner's Mac, checked against its sha256. Homebrew has only the newest.
      # Nothing in this job reads a cache: what is built here is signed and
      # shipped.
      - name: Install xcodegen 2.45.4
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip
          echo "090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Install dmgbuild
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet --require-hashes -r scripts/dmgbuild-requirements.txt
          echo "DMGBUILD=$RUNNER_TEMP/dmgbuild/bin/dmgbuild" >> "$GITHUB_ENV"

      - run: xcodegen generate
      # The tests run before any key is on the runner. A Debug build signs ad hoc.
      - name: Test
        run: xcodebuild test -project Caffeinagent.xcodeproj -scheme Caffeinagent -destination 'platform=macOS,arch=arm64'

      # A dry run uploads nothing, so it is never handed the bucket's key pair
      # or the tap token.
      - name: Check that every secret is set
        env:
          MAC_DEVELOPER_ID_P12_BASE64: ${{ secrets.MAC_DEVELOPER_ID_P12_BASE64 }}
          MAC_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_P12_PASSWORD }}
          MAC_NOTARY_API_KEY_P8_BASE64: ${{ secrets.MAC_NOTARY_API_KEY_P8_BASE64 }}
          MAC_NOTARY_API_KEY_ID: ${{ secrets.MAC_NOTARY_API_KEY_ID }}
          MAC_NOTARY_API_ISSUER_ID: ${{ secrets.MAC_NOTARY_API_ISSUER_ID }}
          MAC_SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.MAC_SPARKLE_ED25519_PRIVATE_KEY }}
          MAC_R2_S3_ACCESS_KEY_ID: ${{ env.DRY_RUN != 'true' && secrets.MAC_R2_S3_ACCESS_KEY_ID || '' }}
          MAC_R2_S3_SECRET_ACCESS_KEY: ${{ env.DRY_RUN != 'true' && secrets.MAC_R2_S3_SECRET_ACCESS_KEY || '' }}
          MAC_CLOUDFLARE_ACCOUNT_ID: ${{ env.DRY_RUN != 'true' && secrets.MAC_CLOUDFLARE_ACCOUNT_ID || '' }}
          MAC_R2_BUCKET: ${{ env.DRY_RUN != 'true' && secrets.MAC_R2_BUCKET || '' }}
        run: |
          set -euo pipefail
          missing=0
          names="MAC_DEVELOPER_ID_P12_BASE64 MAC_DEVELOPER_ID_P12_PASSWORD
            MAC_NOTARY_API_KEY_P8_BASE64 MAC_NOTARY_API_KEY_ID MAC_NOTARY_API_ISSUER_ID
            MAC_SPARKLE_ED25519_PRIVATE_KEY"
          if [ "$DRY_RUN" != "true" ]; then
            names="$names MAC_R2_S3_ACCESS_KEY_ID MAC_R2_S3_SECRET_ACCESS_KEY MAC_CLOUDFLARE_ACCOUNT_ID MAC_R2_BUCKET"
          fi
          for name in $names; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set in the environment mac-release"
              missing=1
            fi
          done
          exit "$missing"

      - name: Import the Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.MAC_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/mac-release.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          P12="$RUNNER_TEMP/developer-id.p12"
          umask 077
          printf '%s' "$P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -P "$P12_PASSWORD" -f pkcs12 -k "$KEYCHAIN" \
            -T /usr/bin/codesign -T /usr/bin/security > /dev/null
          rm -f "$P12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application"; then
            echo "::error::the keychain holds no valid Developer ID Application identity"
            exit 1
          fi

      - name: Write the notary key
        env:
          P8_BASE64: ${{ secrets.MAC_NOTARY_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          P8="$RUNNER_TEMP/notary-key.p8"
          umask 077
          printf '%s' "$P8_BASE64" | base64 --decode > "$P8"
          echo "NOTARY_API_KEY_FILE=$P8" >> "$GITHUB_ENV"

      - name: Write the Sparkle key
        env:
          SPARKLE_KEY: ${{ secrets.MAC_SPARKLE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/sparkle-ed25519.key"
          umask 077
          printf '%s\n' "$SPARKLE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          echo "SPARKLE_ED_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"

      # No key pair for the bucket here: without one, release.sh reads the
      # published appcast from files.caffeinagent.com, and a dry run uploads
      # nothing. It notarizes all the same, so the files it keeps are the ones
      # a release would upload.
      - name: Release (dry run)
        if: env.DRY_RUN == 'true'
        env:
          NOTARY_API_KEY_ID: ${{ secrets.MAC_NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.MAC_NOTARY_API_ISSUER_ID }}
        run: bash scripts/release.sh --dry-run --notarize

      # release.sh reaches the bucket through its S3 endpoint with curl, tests
      # the key pair against the bucket before it builds, uploads the dmg first
      # and the feeds last, and checks the files on files.caffeinagent.com.
      - name: Release
        if: env.DRY_RUN != 'true'
        env:
          NOTARY_API_KEY_ID: ${{ secrets.MAC_NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.MAC_NOTARY_API_ISSUER_ID }}
          R2_S3_ACCESS_KEY_ID: ${{ secrets.MAC_R2_S3_ACCESS_KEY_ID }}
          R2_S3_SECRET_ACCESS_KEY: ${{ secrets.MAC_R2_S3_SECRET_ACCESS_KEY }}
          R2_S3_ENDPOINT: https://${{ secrets.MAC_CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.MAC_R2_BUCKET }}
        run: bash scripts/release.sh

      # No step after this one needs a key, so none is on the runner while the
      # tap's code runs.
      - name: Remove the keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/mac-release.keychain-db" 2> /dev/null || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/sparkle-ed25519.key"

      # What the jobs after this one need, read from the latest.json that was
      # uploaded, and each value checked as a whole string before it is passed on.
      - name: Read what was released
        id: result
        env:
          DETECTED_VERSION: ${{ needs.detect.outputs.version }}
          DETECTED_BUILD: ${{ needs.detect.outputs.build }}
        run: |
          set -euo pipefail
          LATEST=build/release/site/latest.json
          version=$(jq -er '.version' "$LATEST")
          build=$(jq -er '.build' "$LATEST")
          filename=$(jq -er '.filename' "$LATEST")
          url=$(jq -er '.url' "$LATEST")
          sha256=$(jq -er '.sha256' "$LATEST")
          if ! [[ "$version" =~ ^[0-9]{1,9}(\.[0-9]{1,9}){0,2}$ ]] \
            || ! [[ "$build" =~ ^[0-9]{1,9}$ ]] \
            || ! [[ "$filename" =~ ^agent-caffeine-[0-9.]+\.dmg$ ]] \
            || ! [[ "$url" =~ ^https://caffeinagent\.com/mac/agent-caffeine-[0-9.]+-[0-9]+\.dmg$ ]] \
            || ! [[ "$sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::$LATEST does not hold what a release writes"
            exit 1
          fi
          if [ "$version" != "$DETECTED_VERSION" ] || [ "$build" != "$DETECTED_BUILD" ]; then
            echo "::error::the app is $version (build $build), but project.yml read as $DETECTED_VERSION (build $DETECTED_BUILD)"
            exit 1
          fi
          {
            echo "version=$version"
            echo "build=$build"
            echo "filename=$filename"
            echo "url=$url"
            echo "sha256=$sha256"
            if [ "$DRY_RUN" != "true" ]; then
              echo "uploaded=true"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Keep the dry run's files
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac-release-dry-run
          path: |
            build/release/site/*.dmg
            build/release/site/appcast.xml
            build/release/site/latest.json
          if-no-files-found: error
          retention-days: 7

      # The tap token is optional: without it the cask is left for the owner.
      - name: Look for the Homebrew tap token
        id: tap
        if: env.DRY_RUN != 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ env.DRY_RUN != 'true' && secrets.HOMEBREW_TAP_TOKEN || '' }}
        run: |
          set -euo pipefail
          if [ -n "$HOMEBREW_TAP_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::HOMEBREW_TAP_TOKEN is not set, so the cask in mertbuilds/homebrew-tap was not bumped"
          fi

      - name: Check out the Homebrew tap
        if: steps.tap.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mertbuilds/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      # The tap's own script: version, sha256, brew style, brew audit, commit
      # and push. The audit downloads the dmg that was just uploaded.
      - name: Bump the Homebrew cask
        if: steps.tap.outputs.enabled == 'true'
        working-directory: homebrew-tap
        env:
          VERSION: ${{ steps.result.outputs.version }}
          BUILD: ${{ steps.result.outputs.build }}
          URL: ${{ steps.result.outputs.url }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! bash scripts/bump-cask.sh agent-caffeine "$VERSION,$BUILD" "$GITHUB_WORKSPACE/build/release/site/${URL##*/}" --push; then
            echo "::error::the release is live, but the cask was not bumped. The owner can run in a clone of mertbuilds/homebrew-tap: scripts/bump-cask.sh agent-caffeine $VERSION,$BUILD $URL --push"
            exit 1
          fi

      - name: Remove the tap's clone
        if: always()
        run: rm -rf homebrew-tap

  # The tag and the GitHub release are a record of what was released, written
  # after the fact. A tag pushed with the built-in token starts no workflow.
  # It runs once the files are live, also when only the cask bump failed. It
  # reads release-notes/ and runs no code from the repo.
  github-release:
    name: Tag v${{ needs.release.outputs.version }} and write the GitHub release
    needs: [detect, release]
    if: always() && needs.release.outputs.uploaded == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: release-notes

      - name: Write the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
          BUILD: ${{ needs.release.outputs.build }}
          FILENAME: ${{ needs.release.outputs.filename }}
          URL: ${{ needs.release.outputs.url }}
          SHA256: ${{ needs.release.outputs.sha256 }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          by_hand="The release is live; only the tag and the GitHub release are missing. The owner can add them: gh release create $tag --target $GITHUB_SHA"
          repo="repos/$GITHUB_REPOSITORY"
          # A new build of the same version finds the tag of the earlier build.
          # The tag is a record and is never moved.
          if ref=$(gh api "$repo/git/ref/tags/$tag" 2> "$RUNNER_TEMP/ref-error"); then
            sha=$(printf '%s' "$ref" | jq -r '.object.sha')
            if [ "$(printf '%s' "$ref" | jq -r '.object.type')" = "tag" ]; then
              sha=$(gh api "$repo/git/tags/$sha" --jq '.object.sha')
            fi
            if [ "$sha" != "$GITHUB_SHA" ]; then
              echo "::warning::build $BUILD was released from $GITHUB_SHA, but the tag $tag is already on $sha, so the tag and the GitHub release were left as they are"
              exit 0
            fi
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "the tag and the GitHub release $tag are already there on $GITHUB_SHA"
              exit 0
            fi
          elif ! grep -q "HTTP 404" "$RUNNER_TEMP/ref-error"; then
            cat "$RUNNER_TEMP/ref-error" >&2
            echo "::error::could not ask whether the tag $tag is there. $by_hand"
            exit 1
          elif gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::warning::build $BUILD was released from $GITHUB_SHA, but a GitHub release $tag is already there without its tag, so it was left as it is"
            exit 0
          fi
          NOTES="$RUNNER_TEMP/notes.md"
          {
            if [ -f "release-notes/$VERSION.md" ]; then
              cat "release-notes/$VERSION.md"
            else
              echo "Agent Caffeine $VERSION for Mac, build $BUILD."
            fi
            echo ""
            echo "Download: [$FILENAME]($URL)"
            echo ""
            echo "sha256: \`$SHA256\`"
          } > "$NOTES"
          if ! gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Agent Caffeine $VERSION" --notes-file "$NOTES"; then
            echo "::error::could not write the tag or the release $tag. $by_hand"
            exit 1
          fi
          echo "::notice::wrote the tag $tag and the GitHub release on $GITHUB_SHA"
